
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "quant-exploration"
version = "0.1.0"
description = "A-share quantitative research and factor analysis project"
requires-python = ">=3.10"

dependencies = [
    "baostock",
    "numpy",
    "pandas",
    "pyarrow",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["quant*"]
